<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 휴일 일과</title>
</head>
<body>

    <h1>🌿 나의 휴일 일과</h1>

    <table border="1">
        <thead>
            <tr>
                <th>🌅 아침</th>
                <th>☀️ 점심</th>
                <th>🌙 저녁</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>늦잠 & 브런치</td>
                <td>산책 & 사진</td>
                <td>요리 & 영화</td>
            </tr>
        </tbody>
    </table>

    <hr>

    <p><strong>1. 🌅 느긋한 아침</strong></p>

    <small>
        <strong>09:00</strong> 😴 늦잠 자는 행복<br>
        <strong>10:00</strong> 🥞 여유 있게 <mark>브런치</mark> 즐기기<br>
        <strong>11:00</strong> ☕ 커피 한 잔과 🎵 음악 감상
    </small>

    <br><br>

    <p><strong>2. 🌳 오후 활동</strong></p>

    <small>
        <strong>13:00</strong> 🚶 공원 산책하며 마음 정리<br>
        <strong>14:30</strong> 📷 사진 찍으며 일상의 순간 기록<br>
        <strong>16:00</strong> 🛍️ 충동구매 대신 <mark>창의적인 쇼핑</mark>
    </small>

    <br><br>

    <p><strong>3. 🌙 저녁과 밤</strong></p>

    <small>
        <strong>18:00</strong> 🍳 맛있는 저녁 만들기<br>
        <strong>20:00</strong> 🎬 영화 감상<br>
        <strong>23:00</strong> 📖 짧은 독서 후 힐링 타임 🌙
    </small>

</body>
</html>
